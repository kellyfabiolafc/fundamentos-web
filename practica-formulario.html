<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Plano y Responsivo</title>
  <link rel="stylesheet" href="/css/estilos-formularios.css">
</head>
<body>

  <div class="form-container">
    <h2 class="form-title">Registro de Usuario</h2>
    
    <form action="#" method="POST">
      <div class="form-grid">
        
        <!-- Nombre y Apellidos (2 columnas en escritorio) -->
        <div class="form-grid-2-cols">
          <div class="form-group">
            <label class="form-label" for="nombre">Nombre</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" class="form-control" placeholder="Ej. Pérez" required>
          </div>
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" placeholder="juan.perez@ejemplo.com" required>
        </div>

        <!-- Selección de Perfil/Rol (Select) -->
        <div class="form-group">
          <label class="form-label" for="rol">Rol de Usuario</label>
          <select id="rol" class="form-control" required>
            <option value="" disabled selected>Selecciona un rol...</option>
            <option value="admin">Administrador</option>
            <option value="editor">Editor</option>
            <option value="user">Usuario Estándar</option>
          </select>
        </div>

        <!-- Botones -->
        <div class="form-actions">
          <button type="button" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>

      </div>
    </form>
  </div>

</body>
</html>
